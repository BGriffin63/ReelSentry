name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-security-integration:
    runs-on: ubuntu-latest
    steps:
      # NOTE (maintainer): pin these to commit SHAs before public release.
      - uses: actions/checkout@v4
      - name: Ensure tools
        run: sudo apt-get update && sudo apt-get install -y util-linux coreutils
      - name: Run test suite
        run: bash scripts/test.sh
      - name: Build + package + validate
        run: |
          python3 scripts/generate-icons.py
          bash scripts/build.sh
          bash scripts/package.sh
          bash scripts/validate.sh
